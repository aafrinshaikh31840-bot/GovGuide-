
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GovGuide Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef3ff;
      color: #17356d;
    }
    header {
      padding: 22px 8%;
      background: white;
      font-size: 26px;
      font-weight: bold;
    }
    header span { color: #e99a22; }
    .container {
      max-width: 420px;
      margin: 45px auto;
      padding: 30px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px #12345b18;
    }
    h2 { text-align: center; }
    .tabs { display: flex; gap: 10px; }
    button {
      padding: 12px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .tabs button { width: 50%; background: #e9efff; }
    .tabs button.active, .submit {
      background: #17459b;
      color: white;
    }
    label { display: block; margin: 17px 0 7px; }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd5e5;
      border-radius: 8px;
    }
    .submit { width: 100%; margin-top: 22px; }
    #message { text-align: center; font-size: 14px; overflow-wrap: anywhere; }
    .hidden { display: none; }
    .back { display: block; text-align: center; margin-top: 20px; }
  </style>
</head>
<body>
  <header>Gov<span>Guide</span></header>
  <main class="container">
    <div class="tabs">
      <button type="button" id="loginTab" class="active">Login</button>
      <button type="button" id="signupTab">Sign Up</button>
    </div>

    <h2 id="heading">Welcome Back!</h2>

    <form id="authForm">
      <div id="nameBox" class="hidden">
        <label for="name">Full Name</label>
        <input id="name" type="text">
      </div>
      <label for="email">Email Address</label>
      <input id="email" type="email" required autocomplete="email">
      <label for="password">Password</label>
      <input id="password" type="password" minlength="6" required autocomplete="current-password">
<div style="text-align:right;margin:4px 0 14px;"><button type="button" id="forgotBtn" style="background:transparent;color:#2563eb;padding:8px 0;border:0;font-size:14px;font-weight:600;cursor:pointer;text-decoration:underline;">Forgot Password?</button></div>
      <div id="confirmBox" class="hidden">
        <label for="confirm">Confirm Password</label>
        <input id="confirm" type="password" minlength="6">
      </div>
      <button class="submit" id="submitBtn" type="submit">Login</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
    <button id="logoutBtn" class="submit hidden" type="button">Logout</button>
    <a class="back" href="index.html">← Back to Home</a>
  </main>

  <script type="module">
import {
  registerUser,
  loginUser,
  logoutUser,
  watchLoginState,
  resetUserPassword
} from "./js/firebase-auth.js";
    
    import { sendAdminLoginAlert } from "./js/email-notification.js";


    const form = document.getElementById("authForm");
    const message = document.getElementById("message");
    const loginTab = document.getElementById("loginTab");
    const signupTab = document.getElementById("signupTab");
    const logoutBtn = document.getElementById("logoutBtn");
    let mode = "login";
    let busy = false;

    function setMode(next) {
      mode = next;
      form.reset();
      message.textContent = "";
      const signup = mode === "signup";
      document.getElementById("nameBox").classList.toggle("hidden", !signup);
      document.getElementById("confirmBox").classList.toggle("hidden", !signup);
      document.getElementById("name").required = signup;
      document.getElementById("confirm").required = signup;
      document.getElementById("password").autocomplete =
        signup ? "new-password" : "current-password";
      document.getElementById("heading").textContent =
        signup ? "Create Account" : "Welcome Back!";
      document.getElementById("submitBtn").textContent =
        signup ? "Sign Up" : "Login";
      loginTab.classList.toggle("active", !signup);
      signupTab.classList.toggle("active", signup);
    }

    const forgotBtn = document.getElementById("forgotBtn");

    forgotBtn.addEventListener("click", async () => {
      if (mode !== "login") {
        message.textContent = "Please switch to Login first.";
        return;
      }

      const email = document.getElementById("email").value.trim();

      if (!email) {
        message.textContent = "Please enter your email address first.";
        document.getElementById("email").focus();
        return;
      }

      forgotBtn.disabled = true;
      message.textContent = "Sending password reset email...";

      try {
        await resetUserPassword(email);
        message.textContent = "If the account exists, a reset email has been requested. Check your inbox and spam folder.";
      } catch (error) {
        console.error("Password reset failed:", error);
        message.textContent = "Could not request password reset. Check your email and try again.";
      } finally {
        forgotBtn.disabled = false;
      }
    });
    loginTab.addEventListener("click", () => setMode("login"));
    signupTab.addEventListener("click", () => setMode("signup"));

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (busy) return;
      busy = true;
      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      message.textContent = "Please wait...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        if (mode === "signup") {
          if (password !== document.getElementById("confirm").value) {
            throw new Error("Passwords do not match.");
          }
          const result = await registerUser(email, password);
          message.textContent = result;
        } else {
          
          const user = await loginUser(email, password);
          message.textContent = "Login successful.";

          try {
            await sendAdminLoginAlert(user.email);
            message.textContent = "Login successful. Admin notification sent.";
            window.location.href = "index.html";
          } catch (notificationError) {
            console.error("Admin email notification failed:", notificationError);
            message.textContent = "Login successful, but admin email notification failed.";
          }

        }
      } catch (error) {
        message.textContent = error.message || "Something went wrong. Please try again.";
      } finally {
        busy = false;
        submitBtn.disabled = false;
      }
    });

    logoutBtn.addEventListener("click", async () => {
      try {
        await logoutUser();
        message.textContent = "You have logged out.";
      } catch (error) {
        message.textContent = error.message || "Logout failed.";
      }
    });

    watchLoginState((user) => {
      const loggedIn = Boolean(user && user.emailVerified);
      form.classList.toggle("hidden", loggedIn);
      document.querySelector(".tabs").classList.toggle("hidden", loggedIn);
      logoutBtn.classList.toggle("hidden", !loggedIn);
      if (loggedIn) {
        document.getElementById("heading").textContent = "Welcome!";
        message.textContent = "Signed in as " + user.email;
      }
    });
  </script>
</body>
</html>
